# Evita que Supabase pause el proyecto gratuito por inactividad:
# hace una lectura mínima a la base de datos dos veces por semana.
# La clave "publishable" es pública por diseño (va también en el JS del navegador).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4' # lunes y jueves, 06:17 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leer una fila de Supabase
        run: |
          curl --fail --silent --show-error \
            "https://doxorrpoeqxnjwaubirp.supabase.co/rest/v1/prueba_conexion?select=id&limit=1" \
            -H "apikey: sb_publishable_6k_Tzi6YR0AA94CyAmCxew_ynqmP2FQ"
